<form class="form-group row" id="formularioEntrada">
    <div class="form-group col-md-3">
        <label for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre" [(ngModel)]="actualizadorNombre">
    </div>
    <div class="form-group col-md-3">
        <label for="cantidad">Cantidad</label>
        <input type="number" class="form-control" id="cantidad" name="cantidad" placeholder="Cantidad" [(ngModel)]="actualizadorCantidad">
    </div>
    <div class="form-group col-md-3">
        <label for="precio">Precio</label>
        <input type="number" class="form-control" id="precio" name="precio" placeholder="Precio" [(ngModel)]="actualizadorPrecio">
    </div>
    <div class="form-group col-md-3">
        <label for="total">Total</label>
        <input type="number" class="form-control" id="total" name="total" placeholder="Total" [(ngModel)]="actualizadorTotal">
    </div>
</form>
<div class="botonera">
    <button type="button" class="btn btn-primary" id="boton1" (click)="ejecutarAccion()">Acción</button>
</div>
<div style="text-align: center;">
    <button class="btn btn primary" (click)="volverHome()">Volver a Home</button>
</div>
