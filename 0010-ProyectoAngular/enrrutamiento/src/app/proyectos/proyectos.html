<p>proyectos works!</p>
    <form class="form-group row" id="formularioEntrada">
        <div class="form-group col-md-3">
            <label for="nombre">Nombre</label>
            <select class="form-control" id="nombre" name="nombre" placeholder="Nombre" [(ngModel)]="cuadroNombre">
                @for(unidades of proyectosMatriz; track unidades; let i = $index)
                    {
                        <option>{{ i+1 }} - {{unidades.nombre}}</option>
                    }
            </select>    
        </div>
        <div class="form-group col-md-3">
            <label for="cantidad">Cantidad</label>
            <input type="number" class="form-control" id="cantidad" name="cantidad" placeholder="Cantidad" [(ngModel)]="cuadroCantidad">
        </div>
        <div class="form-group col-md-3">
            <label for="precio">Precio</label>
            <input type="number" class="form-control" id="precio" name="precio" placeholder="Precio" [(ngModel)]="cuadroPrecio">
        </div>
    </form>
<div class="botonera">
    <button type="button" class="btn btn-primary" id="boton1" (click)="agregarElementoNuevo()">Agregar</button>
</div>
<div style="text-align: center;">
    <button class="btn btn primary" (click)="volverHome()">Volver a Home</button>
</div>
